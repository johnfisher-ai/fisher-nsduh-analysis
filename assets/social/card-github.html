<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1280px;height:640px}
body{font:16px/1.5 -apple-system,"Helvetica Neue",Arial,sans-serif;background:#0e131c;color:#e6ebf2;
  display:flex;flex-direction:column;overflow:hidden}
.body{flex:1;padding:54px 74px 0;display:flex;flex-direction:column}
.repo{font-family:ui-monospace,Menlo,monospace;font-size:23px;color:#7aa7d9;margin-bottom:28px;letter-spacing:.01em}
.repo .owner{color:#98a3b5}
h1{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;font-weight:600;
  font-size:52px;line-height:1.14;letter-spacing:-.015em;max-width:1060px;color:#fff}
.sub{margin-top:20px;font-size:22px;color:#98a3b5;line-height:1.45;max-width:1000px}
.grid{margin-top:auto;margin-bottom:40px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.c{border:1px solid #243044;border-radius:11px;padding:18px 20px;background:#151d2a}
.c .t{font-size:17px;font-weight:700;color:#e6ebf2}
.c .d{font-size:14.5px;color:#98a3b5;margin-top:6px;line-height:1.4}
.foot{background:#151d2a;border-top:1px solid #243044;padding:19px 74px;display:flex;
  justify-content:space-between;align-items:center;font-size:17px;color:#98a3b5}
.tags span{display:inline-block;border:1px solid #243044;border-radius:5px;padding:3px 10px;
  margin-right:8px;font-size:14px;color:#7aa7d9}
</style></head><body>
<div class="body">
  <div class="repo"><span class="owner">johnfisher-ai /</span> fisher-nsduh-analysis</div>
  <h1>{{TITLE}}</h1>
  <div class="sub">{{SUBTITLE}}</div>
  <div class="grid">
    <div class="c"><div class="t">{{CARD1_T}}</div><div class="d">{{CARD1_D}}</div></div>
    <div class="c"><div class="t">{{CARD2_T}}</div><div class="d">{{CARD2_D}}</div></div>
    <div class="c"><div class="t">{{CARD3_T}}</div><div class="d">{{CARD3_D}}</div></div>
    <div class="c"><div class="t">{{CARD4_T}}</div><div class="d">{{CARD4_D}}</div></div>
  </div>
</div>
<div class="foot">
  <span class="tags"><span>{{TAG1}}</span><span>{{TAG2}}</span><span>{{TAG3}}</span><span>{{TAG4}}</span></span>
  <span>John Fisher</span>
</div>
</body></html>
